name: Release

# Push a tag matching the version in package/metadata.json (e.g. v1.0.0) to
# publish a release with the .plasmoid attached.
on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools libxml2-utils shellcheck jq zip unzip

      - name: Check the tag matches metadata.json and the changelog
        run: |
          version=$(jq -r '.KPlugin.Version' package/metadata.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match metadata.json version $version"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Shell, metadata, config keys and QML syntax
        run: scripts/check.sh

      - name: Build the .plasmoid
        run: scripts/package.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/systemglance-*.plasmoid --title "System Glance $GITHUB_REF_NAME" --generate-notes --verify-tag
