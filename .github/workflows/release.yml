name: Release

# Publish a release whose tag matches the version in package/metadata.json
# (e.g. v1.0.0), from the Releases page or with `gh release create`. This
# builds the .plasmoid and attaches it to that release.
on:
  release:
    types: [published]

jobs:
  release:
    name: Build and attach the .plasmoid
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools libxml2-utils shellcheck jq zip unzip

      - name: Check the tag matches metadata.json and the changelog
        run: |
          version=$(jq -r '.KPlugin.Version' package/metadata.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG doesn't match metadata.json version $version"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Shell, metadata, config keys and QML syntax
        run: scripts/check.sh

      - name: Build the .plasmoid
        run: scripts/package.sh

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/systemglance-*.plasmoid --clobber --repo "$GITHUB_REPOSITORY"
