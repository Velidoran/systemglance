name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools libxml2-utils shellcheck jq zip unzip

      - name: Shell, metadata, config keys and QML syntax
        run: scripts/check.sh

      - name: Build the .plasmoid
        run: scripts/package.sh
